components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TaskId:
      in: path
      name: id
      required: true
      schema:
        type: string
      description: Task identifier
      example: 1d7b50aa-335a-42bf-bfba-af6c6a3f5ebd
    AccountId:
      in: path
      name: accountId
      required: true
      schema:
        type: string
      description: Account identifier
      example: acct-test-1
    IdempotencyKey:
      in: header
      name: idempotency-key
      required: true
      schema:
        type: string
      description: Unique key for deduplicating payment requests
      example: order-123
    GithubSignatureHeader:
      in: header
      name: x-hub-signature-256
      required: true
      schema:
        type: string
      description: GitHub HMAC digest in the format sha256=<hex>
      example: sha256=6f0ebf3e0a6fa7a0f83a4b91f410f7f5952b0b08356f3b7ec00f2ce39131b615
    GithubEventHeader:
      in: header
      name: x-github-event
      required: false
      schema:
        type: string
      description: GitHub event type
      example: push

  schemas:
    GenericObject:
      type: object
      additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
      required: [error]

    StudyCase:
      type: object
      properties:
        id:
          type: string
        route:
          type: string
        title:
          type: string
        focus:
          type: string
      required: [id, route, title, focus]

    TaskCreate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
          default: todo
      required: [title]

    TaskUpdate:
      type: object
      properties:
        title:
          type: string
          minLength: 3
        description:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
      minProperties: 1

    GraphqlRequest:
      type: object
      properties:
        query:
          type: string
        variables:
          type: object
          additionalProperties: true
      required: [query]

    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 2
      required: [email, name]

    TransferRequest:
      type: object
      properties:
        fromOwner:
          type: string
        toOwner:
          type: string
        amount:
          type: number
          exclusiveMinimum: 0
      required: [fromOwner, toOwner, amount]

    MetricIngestRequest:
      type: object
      properties:
        service:
          type: string
          minLength: 2
        value:
          type: number
      required: [service, value]

    AuthLogin:
      type: object
      properties:
        username:
          type: string
          minLength: 2
        role:
          type: string
          enum: [admin, developer, viewer]
          default: developer
      required: [username]

    CheckoutRequest:
      type: object
      properties:
        sku:
          type: string
        quantity:
          type: integer
          minimum: 1
        amount:
          type: number
          exclusiveMinimum: 0
      required: [sku, quantity, amount]

    QueueEnqueueRequest:
      type: object
      properties:
        type:
          type: string
        payload:
          type: object
          additionalProperties: true
        maxAttempts:
          type: integer
          minimum: 1
          default: 3
      required: [type]

    IdempotentPaymentRequest:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
        currency:
          type: string
          default: USD
      required: [amount]

    SummarizeRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 20
      required: [text]

    ResilienceInvoke:
      type: object
      properties:
        dependency:
          type: string
          minLength: 2
          maxLength: 64
          default: payment-gateway
        scenario:
          type: string
          enum: [success, fail, timeout, flaky]
          default: success
        timeoutMs:
          type: integer
          minimum: 60
          maximum: 3000
      required: [dependency]

    OpenAccountRequest:
      type: object
      properties:
        accountId:
          type: string
        initialBalance:
          type: number
          minimum: 0
          maximum: 1000000
        commandId:
          type: string
      required: [initialBalance]

    AmountCommandRequest:
      type: object
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          maximum: 1000000
        commandId:
          type: string
      required: [amount]
