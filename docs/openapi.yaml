openapi: 3.0.3
info:
  title: Backend Developer Node.js Study Lab API
  version: 1.1.0
  description: >-
    Complete OpenAPI reference for the backend study cases.
    Includes request body schemas, request examples, and response examples
    for both success and common error outcomes.
servers:
  - url: http://localhost:3000
    description: Local development server
tags:
  - name: Documentation
  - name: Foundations
  - name: Data and Platform
  - name: Distributed Systems
  - name: Product and Observability
  - name: Delivery and Architecture
  - name: Reliability and Domain

paths:
  /docs/study-cases:
    get:
      tags: [Documentation]
      summary: Get study case catalog JSON
      operationId: getStudyCasesDocs
      responses:
        "200":
          description: Study case inventory with docs links
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  routes:
                    type: array
                    items:
                      type: string
                  details:
                    type: array
                    items:
                      $ref: "#/components/schemas/StudyCase"
                  openApi:
                    type: string
                  openApiUi:
                    type: string
              examples:
                success:
                  value:
                    message: Open README.md and docs/study-cases.md in the project folder for full guide
                    routes:
                      - /cases/01-health
                      - /cases/02-typescript-crud
                      - /cases/17-event-sourcing-cqrs
                    details:
                      - id: "01"
                        route: /cases/01-health
                        title: Health and readiness
                        focus: Service uptime, request IDs, production-style probes
                      - id: "17"
                        route: /cases/17-event-sourcing-cqrs
                        title: Event sourcing and CQRS
                        focus: Command handling, append-only events, and projection rebuild
                    openApi: /docs/openapi.yaml
                    openApiUi: /docs/openapi

  /cases/01-health:
    get:
      tags: [Foundations]
      summary: Health and readiness probe
      operationId: getCase01Health
      responses:
        "200":
          description: Health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 01-health
                    status: ok
                    requestId: 4c9654f6-b5d9-4718-9d9c-a334f31d2ef4
                    uptimeSeconds: 51.203
                    timestamp: 2026-04-11T09:00:18.201Z

  /cases/02-typescript-crud:
    get:
      tags: [Foundations]
      summary: List all in-memory tasks
      operationId: listCase02Tasks
      responses:
        "200":
          description: Current task list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 02-typescript-crud
                    count: 1
                    data:
                      - id: 1d7b50aa-335a-42bf-bfba-af6c6a3f5ebd
                        createdAt: 2026-04-11T09:02:02.010Z
                        title: Study TypeScript backend flow
                        description: created from phase runner
                        status: todo
    post:
      tags: [Foundations]
      summary: Create a new task
      operationId: createCase02Task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreate"
            examples:
              createTask:
                value:
                  title: Study TypeScript backend flow
                  description: created from phase runner
                  status: todo
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                created:
                  value:
                    id: 1d7b50aa-335a-42bf-bfba-af6c6a3f5ebd
                    createdAt: 2026-04-11T09:02:02.010Z
                    title: Study TypeScript backend flow
                    description: created from phase runner
                    status: todo
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidPayload:
                  value:
                    error:
                      fieldErrors:
                        title:
                          - String must contain at least 3 character(s)
                      formErrors: []

  /cases/02-typescript-crud/{id}:
    patch:
      tags: [Foundations]
      summary: Update task fields by id
      operationId: updateCase02Task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
            examples:
              updateTask:
                value:
                  status: done
                  description: Finished the CRUD walkthrough
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                updated:
                  value:
                    id: 1d7b50aa-335a-42bf-bfba-af6c6a3f5ebd
                    createdAt: 2026-04-11T09:02:02.010Z
                    title: Study TypeScript backend flow
                    description: Finished the CRUD walkthrough
                    status: done
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidStatus:
                  value:
                    error:
                      fieldErrors:
                        status:
                          - Invalid enum value. Expected 'todo' | 'in_progress' | 'done'
                      formErrors: []
        "404":
          description: Task id not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: Task not found
    delete:
      tags: [Foundations]
      summary: Delete a task by id
      operationId: deleteCase02Task
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Removed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                removed:
                  value:
                    removed:
                      id: 1d7b50aa-335a-42bf-bfba-af6c6a3f5ebd
                      createdAt: 2026-04-11T09:02:02.010Z
                      title: Study TypeScript backend flow
                      description: created from phase runner
                      status: todo
        "404":
          description: Task id not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                notFound:
                  value:
                    error: Task not found

  /cases/03-graphql:
    post:
      tags: [Foundations]
      summary: Execute GraphQL query or mutation
      operationId: executeCase03Graphql
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GraphqlRequest"
            examples:
              queryBooks:
                value:
                  query: "{ books { id title author } }"
              addBook:
                value:
                  query: 'mutation { addBook(title: "Clean Code", author: "Robert C. Martin") { id title author } }'
      responses:
        "200":
          description: GraphQL execution result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                booksQuery:
                  value:
                    data:
                      books:
                        - id: "1"
                          title: Designing Data-Intensive Applications
                          author: Martin Kleppmann
                        - id: "2"
                          title: Clean Architecture
                          author: Robert C. Martin

  /cases/04-postgres/setup:
    post:
      tags: [Data and Platform]
      summary: Create study_users table and index
      operationId: setupCase04Postgres
      responses:
        "200":
          description: Table ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 04-postgres
                    message: study_users table ready
        "500":
          description: Database setup error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                setupFailed:
                  value:
                    case: 04-postgres
                    error: Could not connect to Postgres

  /cases/04-postgres/users:
    post:
      tags: [Data and Platform]
      summary: Insert a user row
      operationId: createCase04User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
            examples:
              createUser:
                value:
                  email: learner@example.com
                  name: Backend Learner
      responses:
        "201":
          description: User inserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                created:
                  value:
                    id: 14
                    email: learner@example.com
                    name: Backend Learner
                    created_at: 2026-04-11T09:12:00.100Z
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidEmail:
                  value:
                    error:
                      fieldErrors:
                        email:
                          - Invalid email
                      formErrors: []
        "500":
          description: Insert failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insertFailed:
                  value:
                    error: duplicate key value violates unique constraint "study_users_email_key"
    get:
      tags: [Data and Platform]
      summary: List recent users
      operationId: listCase04Users
      responses:
        "200":
          description: User rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 04-postgres
                    count: 2
                    data:
                      - id: 14
                        email: learner@example.com
                        name: Backend Learner
                        created_at: 2026-04-11T09:12:00.100Z
                      - id: 13
                        email: demo@example.com
                        name: Demo User
                        created_at: 2026-04-11T09:10:00.100Z
        "500":
          description: Query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                queryFailed:
                  value:
                    error: Query failed

  /cases/04b-postgres-transactions/setup:
    post:
      tags: [Data and Platform]
      summary: Prepare wallet tables and seed balances
      operationId: setupCase04bTransactions
      responses:
        "200":
          description: Wallet tables ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 04b-postgres-transactions
                    message: wallet tables ready
        "500":
          description: Setup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                setupFailed:
                  value:
                    error: Setup failed

  /cases/04b-postgres-transactions/transfer:
    post:
      tags: [Data and Platform]
      summary: Perform ACID wallet transfer
      operationId: transferCase04bFunds
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
            examples:
              transfer:
                value:
                  fromOwner: alice
                  toOwner: bob
                  amount: 25
      responses:
        "200":
          description: Transfer succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 04b-postgres-transactions
                    transferred:
                      fromOwner: alice
                      toOwner: bob
                      amount: 25
        "400":
          description: Invalid transfer or business-rule failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insufficientBalance:
                  value:
                    error: Insufficient balance
                invalidInput:
                  value:
                    error: Invalid transfer input

  /cases/04b-postgres-transactions/balances:
    get:
      tags: [Data and Platform]
      summary: Get current wallet balances
      operationId: getCase04bBalances
      responses:
        "200":
          description: Wallet balances
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 04b-postgres-transactions
                    data:
                      - owner: alice
                        balance: "975"
                      - owner: bob
                        balance: "525"
        "500":
          description: Read failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                readFailed:
                  value:
                    error: Read failed

  /cases/05-timescale/setup:
    post:
      tags: [Data and Platform]
      summary: Setup Timescale extension and hypertable
      operationId: setupCase05Timescale
      responses:
        "200":
          description: Hypertable created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 05-timescale
                    message: hypertable ready
        "500":
          description: Setup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                setupFailed:
                  value:
                    error: Timescale setup failed

  /cases/05-timescale/metrics:
    post:
      tags: [Data and Platform]
      summary: Ingest service metric point
      operationId: ingestCase05Metric
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MetricIngestRequest"
            examples:
              ingestMetric:
                value:
                  service: api
                  value: 123.4
      responses:
        "201":
          description: Metric inserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                created:
                  value:
                    case: 05-timescale
                    ingested:
                      service: api
                      value: 123.4
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidPayload:
                  value:
                    error:
                      fieldErrors:
                        service:
                          - String must contain at least 2 character(s)
                      formErrors: []
        "500":
          description: Insert failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                insertFailed:
                  value:
                    error: Insert metric failed

  /cases/05-timescale/query:
    get:
      tags: [Data and Platform]
      summary: Query aggregated metrics
      operationId: queryCase05Metrics
      parameters:
        - in: query
          name: service
          required: false
          schema:
            type: string
            default: api
          description: Service name filter
          example: api
        - in: query
          name: minutes
          required: false
          schema:
            type: integer
            default: 60
            minimum: 1
          description: Sliding time window in minutes
          example: 60
      responses:
        "200":
          description: Aggregated metric buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 05-timescale
                    service: api
                    minutes: 60
                    data:
                      - bucket: 2026-04-11T09:10:00.000Z
                        avg_value: 121.2
                      - bucket: 2026-04-11T09:05:00.000Z
                        avg_value: 117.4
        "500":
          description: Query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                queryFailed:
                  value:
                    error: Timescale query failed

  /cases/06-hasura/action/greet:
    post:
      tags: [Data and Platform]
      summary: Hasura action webhook sample
      operationId: runCase06HasuraAction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              hasuraAction:
                value:
                  session_variables:
                    x-hasura-role: developer
                  input:
                    name: backend learner
      responses:
        "200":
          description: Action response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 06-hasura
                    message: Hello backend learner, request accepted for role developer

  /cases/06-hasura/event/order-created:
    post:
      tags: [Data and Platform]
      summary: Hasura event-trigger webhook sample
      operationId: runCase06HasuraEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            examples:
              hasuraEvent:
                value:
                  event:
                    id: 9f0c7647-798e-42f5-a56a-7f80bc10d2dc
                    data:
                      new:
                        id: ord_123
                        amount: 99
                      old: null
      responses:
        "200":
          description: Event callback ack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 06-hasura
                    received: true
                    eventId: 9f0c7647-798e-42f5-a56a-7f80bc10d2dc
                    table: insert

  /cases/07-auth/login:
    post:
      tags: [Foundations]
      summary: Sign a JWT for a user role
      operationId: loginCase07
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthLogin"
            examples:
              developerLogin:
                value:
                  username: dev-user
                  role: developer
              adminLogin:
                value:
                  username: platform-admin
                  role: admin
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 07-auth
                    token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.sample
                    user:
                      username: dev-user
                      role: developer
        "400":
          description: Validation failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidRole:
                  value:
                    error:
                      fieldErrors:
                        role:
                          - Invalid enum value. Expected 'admin' | 'developer' | 'viewer'
                      formErrors: []

  /cases/07-auth/profile:
    get:
      tags: [Foundations]
      summary: Read authenticated profile claims
      operationId: getCase07Profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 07-auth
                    profile:
                      sub: dev-user
                      role: developer
                      iss: backend-study-lab
                      aud: backend-study-lab-clients
                      iat: 1775899800
                      exp: 1775903400
                    requestId: 74efbf2a-9613-4462-9c75-0c8de5fa6d02
        "401":
          description: Missing/invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    error: Unauthorized

  /cases/07-auth/admin:
    get:
      tags: [Foundations]
      summary: Admin-only authorization check
      operationId: getCase07Admin
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Access granted for admin role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 07-auth
                    ok: true
                    message: Welcome admin platform-admin
        "401":
          description: Missing/invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  value:
                    error: Unauthorized
        "403":
          description: Authenticated but missing role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                forbidden:
                  value:
                    error: Forbidden

  /cases/08-microservices/setup:
    post:
      tags: [Distributed Systems]
      summary: Setup orders and outbox tables
      operationId: setupCase08
      responses:
        "200":
          description: Tables ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 08-microservices
                    message: service_orders and outbox_events are ready
        "500":
          description: Setup failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                setupFailed:
                  value:
                    error: Setup failed

  /cases/08-microservices/orders:
    post:
      tags: [Distributed Systems]
      summary: Create order and outbox event in one transaction
      operationId: createCase08Order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                amount:
                  type: number
                  exclusiveMinimum: 0
              required: [customerId, amount]
            examples:
              createOrder:
                value:
                  customerId: user-1
                  amount: 299
      responses:
        "201":
          description: Order accepted and event queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                created:
                  value:
                    case: 08-microservices
                    orderId: 96e356af-e077-4a5e-9abf-8fdb8f6ef7cc
                    outboxEventId: 72c49fe9-7d63-49bc-8ca9-bdcbd12fcf75
        "400":
          description: Invalid amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalidAmount:
                  value:
                    error: amount must be greater than 0
        "500":
          description: Order create failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                createFailed:
                  value:
                    error: Order create failed

  /cases/08-microservices/process-outbox:
    post:
      tags: [Distributed Systems]
      summary: Process next pending outbox event
      operationId: processCase08Outbox
      responses:
        "200":
          description: Processing result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                processed:
                  value:
                    case: 08-microservices
                    processed: true
                    eventId: 72c49fe9-7d63-49bc-8ca9-bdcbd12fcf75
                emptyQueue:
                  value:
                    case: 08-microservices
                    processed: false
        "500":
          description: Outbox processing failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                processFailed:
                  value:
                    error: Outbox processing failed

  /cases/08-microservices/state:
    get:
      tags: [Distributed Systems]
      summary: Read order and outbox state
      operationId: getCase08State
      responses:
        "200":
          description: Current order and outbox records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                success:
                  value:
                    case: 08-microservices
                    orders:
                      - id: 96e356af-e077-4a5e-9abf-8fdb8f6ef7cc
                        customerId: user-1
                        amount: 299
                        status: processed
                        createdAt: 2026-04-11T09:22:00.000Z
                    outbox:
                      - id: 72c49fe9-7d63-49bc-8ca9-bdcbd12fcf75
                        eventType: order.created
                        payload:
                          id: 96e356af-e077-4a5e-9abf-8fdb8f6ef7cc
                          customerId: user-1
                          amount: 299
                          status: created
                        published: true
                        createdAt: 2026-04-11T09:22:00.000Z
                        publishedAt: 2026-04-11T09:22:01.000Z
        "500":
          description: State query failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                stateFailed:
                  value:
                    error: State query failed

  /cases/08b-service-boundary/checkout:
    post:
      tags: [Distributed Systems]
      summary: Reserve inventory then authorize payment
      operationId: checkoutCase08b
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
            examples:
              checkout:
                value:
                  sku: keyboard
                  quantity: 1
                  amount: 120
      responses:
        "201":
          description: Checkout completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenericObject"
              examples:
                created:
                  value:
                    case: 08b-service-boundary
                    status: order_confirmed
                    sku: keyboard
                    quantity: 1
